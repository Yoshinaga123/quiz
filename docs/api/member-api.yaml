openapi: 3.1.0
info:
  title: Member API
  version: 0.1.0-draft
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  description: |
    会員向け認証つき API のドラフト仕様 (ADR 0016)。

    - 匿名の Public Quiz API (`public-quiz-api.yaml`) とは別ファイル。`publicQuiz` に
      会員フィールドは混ぜない。
    - 認証: `MEMBER_JWT_SECRET` で署名した Bearer JWT (aud=`member`)。admin JWT は
      受理しない。
    - shape を変えたら、この YAML・`packages/web/src/schemas/member.ts`・
      `packages/backend/me.go` の型・`docs/api/fixtures/member-*.json` /
      `answer-history-*.json`・テストを同じ PR で直す。

servers:
  - url: http://localhost:8082
    description: Local development (packages/backend/docker-compose.yml).
  - url: https://socrates-quiz.jp
    description: Production public URL.

tags:
  - name: members
    description: 会員登録・ログイン
  - name: me
    description: 自分自身の情報・回答履歴（要 Bearer 認証）

components:
  securitySchemes:
    memberBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        `POST /api/session` で発行される会員 JWT。`aud=member`。admin JWT は不可。
  schemas:
    MemberRegisterRequest:
      type: object
      required: [handle, password]
      properties:
        handle:
          type: string
          minLength: 3
          maxLength: 32
          pattern: "^[a-zA-Z0-9_]+$"
        password:
          type: string
          minLength: 8
          maxLength: 128
    MemberRegisterResponse:
      type: object
      required: [id, handle]
      properties:
        id:
          type: string
          format: uuid
          description: UUID v7
        handle:
          type: string
    MemberSessionRequest:
      type: object
      required: [handle, password]
      properties:
        handle:
          type: string
        password:
          type: string
    MemberSessionResponse:
      type: object
      required: [token]
      properties:
        token:
          type: string
    PublicMember:
      type: object
      required: [id, handle, hasVerifiedEmail]
      properties:
        id:
          type: string
          format: uuid
        handle:
          type: string
        hasVerifiedEmail:
          type: boolean
          description: |
            ADR 0018 §6: email そのものは決してレスポンスに含めない。
            検証済みメールが登録されているかどうかの boolean だけを公開する。
      description: |
        ADR 0016 §6: password_hash, createdAt, updatedAt, deletedAt, email を含めてはならない。
    AnswerHistoryCreateRequest:
      type: object
      required: [quizId, selectedIndex]
      properties:
        quizId:
          type: integer
          format: int64
          minimum: 1
        selectedIndex:
          type: integer
          minimum: 0
    AnswerHistoryEntry:
      type: object
      required: [id, quizId, selectedIndex, isCorrect, answeredAt]
      properties:
        id:
          type: integer
          format: int64
        quizId:
          type: integer
          format: int64
        selectedIndex:
          type: integer
          minimum: 0
        isCorrect:
          type: boolean
          description: |
            `quizzes.correct_answer_index` との JOIN で都度算出（ADR 0016 §4）。
            過去に正解訂正があった場合、過去の履歴の isCorrect も自動追従する。
        answeredAt:
          type: string
          format: date-time
    AnswerHistoryListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AnswerHistoryEntry"
    PublicError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string

paths:
  /api/members:
    post:
      tags: [members]
      summary: 会員登録
      operationId: registerMember
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberRegisterRequest"
      responses:
        "201":
          description: 作成
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberRegisterResponse"
        "400":
          description: バリデーションエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicError"
        "409":
          description: ハンドル重複
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicError"

  /api/session:
    post:
      tags: [members]
      summary: ログインして会員 JWT を発行
      operationId: createMemberSession
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberSessionRequest"
      responses:
        "200":
          description: 発行成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberSessionResponse"
        "401":
          description: 認証失敗（存在しない・パスワード違い・削除済み）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicError"

  /api/me:
    get:
      tags: [me]
      summary: 自分自身の会員情報
      operationId: getMe
      security: [{memberBearer: []}]
      responses:
        "200":
          description: 取得
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicMember"
        "401":
          description: 未認証 / 削除済み
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicError"
    delete:
      tags: [me]
      summary: 自分自身をソフト削除
      operationId: deleteMe
      security: [{memberBearer: []}]
      responses:
        "204":
          description: 削除完了
        "401":
          description: 未認証 / 既に削除済み
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicError"

  /api/me/answers:
    get:
      tags: [me]
      summary: 自分の回答履歴
      operationId: listAnswerHistory
      security: [{memberBearer: []}]
      parameters:
        - in: query
          name: quizId
          schema:
            type: integer
            format: int64
            minimum: 1
          required: false
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          required: false
      responses:
        "200":
          description: 履歴一覧
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnswerHistoryListResponse"
        "400":
          description: パラメータ不正
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicError"
        "401":
          description: 未認証 / 削除済み
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicError"
    post:
      tags: [me]
      summary: 回答を記録
      operationId: createAnswerHistory
      security: [{memberBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnswerHistoryCreateRequest"
      responses:
        "201":
          description: 記録完了
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnswerHistoryEntry"
        "400":
          description: 不正なリクエスト（未知の quizId 等）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicError"
        "401":
          description: 未認証 / 削除済み
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicError"
