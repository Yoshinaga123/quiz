# Lightsail static-IP HTTPS deployment. See docs/deploy-lightsail.md.
# Run from this directory after filling .env (see .env.example).

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../../packages/backend
      target: runtime
    restart: unless-stopped
    environment:
      APP_ENV: production
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      MEMBER_JWT_SECRET: ${MEMBER_JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8080"

  web:
    build:
      context: ../..
      dockerfile: packages/web/Dockerfile
      target: runtime
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    restart: unless-stopped
    expose:
      - "80"

  admin-web:
    build:
      context: ../..
      dockerfile: packages/admin-web/Dockerfile
      target: runtime
      args:
        VITE_API_BASE_URL: ""
    restart: unless-stopped
    expose:
      - "80"

  caddy:
    image: caddy:2.11.2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./artifacts:/srv/downloads:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web
      - admin-web

volumes:
  pgdata:
  caddy_data:
  caddy_config:
