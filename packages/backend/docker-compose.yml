services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: counter
    ports:
      - "5433:5432"
  api:
    build:
      context: .
      target: dev
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: password
      DB_NAME: counter
      ADMIN_USER: admin
      ADMIN_PASSWORD: password
      JWT_SECRET: dev-only-secret
      QUIZ_SEED_GENERATOR_SCRIPT: /workspace/scripts/generate_migration.py
      QUIZ_SEED_PATH: /data/quizzes.json
    ports:
      - "8082:8080"
    volumes:
      - .:/app
      - ../admin-web/src/data/quizzes.json:/data/quizzes.json:ro
      - ../../scripts:/workspace/scripts:ro
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    depends_on:
      - db

volumes:
  go-mod-cache:
  go-build-cache:
