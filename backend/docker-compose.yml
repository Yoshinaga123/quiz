services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: counter
    ports:
      - "5432:5432"
  api:
    build:
      context: .
      target: dev
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: password
      DB_NAME: counter
      ADMIN_USER: admin
      ADMIN_PASSWORD: password
      JWT_SECRET: dev-only-secret
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    depends_on:
      - db

volumes:
  go-mod-cache:
  go-build-cache:
