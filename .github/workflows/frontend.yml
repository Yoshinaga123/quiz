name: Frontend

on:
  push:
    branches: [main, develop]
    paths:
      - "packages/admin-web/**"
      - "packages/web/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "packages/admin-web/**"
      - "packages/web/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/frontend.yml"

permissions:
  contents: read

jobs:
  admin-web:
    name: admin-web build, lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        working-directory: packages/admin-web
        run: npm run lint
      - name: Test
        working-directory: packages/admin-web
        run: npm run test
      - name: Type check & build
        working-directory: packages/admin-web
        run: npm run build

  web:
    name: web build, lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        working-directory: packages/web
        run: npm run lint
      - name: Test
        working-directory: packages/web
        run: npm run test
      - name: Type check & build
        working-directory: packages/web
        run: npm run build
