name: Frontend

on:
  push:
    branches: [main]
    paths:
      - "admin-web/**"
      - "web/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "admin-web/**"
      - "web/**"
      - ".github/workflows/frontend.yml"

permissions:
  contents: read

jobs:
  admin-web:
    name: admin-web build & lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin-web/package-lock.json
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
      - name: Lint
        run: npm run lint
      - name: Type check & build
        run: npm run build

  web:
    name: web build & lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
      - name: Lint
        run: npm run lint
      - name: Type check & build
        run: npm run build
