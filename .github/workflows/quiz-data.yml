name: Quiz Data

on:
  push:
    branches: [main]
    paths:
      - "packages/admin-web/src/data/quizzes.json"
      - "packages/backend/migrations/**"
      - "scripts/**"
      - ".github/workflows/quiz-data.yml"
  pull_request:
    paths:
      - "packages/admin-web/src/data/quizzes.json"
      - "packages/backend/migrations/**"
      - "scripts/**"
      - ".github/workflows/quiz-data.yml"

permissions:
  contents: read

jobs:
  lint:
    name: Quiz JSON lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Lint quizzes.json
        run: python3 scripts/lint_quizzes.py packages/admin-web/src/data/quizzes.json
      - name: Test seed SQL generator
        run: python3 -m unittest scripts/test_generate_migration.py

  drift:
    name: Published seed drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check published seed drift
        run: |
          python3 scripts/check_quiz_drift.py \
            --seed packages/admin-web/src/data/quizzes.json \
            --migrations-dir packages/backend/migrations \
            --print-diff
