name: Quality

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  hygiene:
    name: hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Repo hygiene
        run: python3 scripts/check_repo_hygiene.py
      - name: Docs frontmatter and links
        run: python3 scripts/check_docs.py
      - name: Public contract fields
        run: python3 scripts/check_public_contract.py

  test:
    name: npm test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: packages/backend/go.sum
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test

  circular:
    name: circular imports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Circular imports
        run: npm run check:circular
