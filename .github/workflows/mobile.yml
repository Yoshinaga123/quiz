name: Mobile

on:
  push:
    branches: [main, develop]
    paths:
      - "packages/mobile/**"
      - ".github/workflows/mobile.yml"
  pull_request:
    paths:
      - "packages/mobile/**"
      - ".github/workflows/mobile.yml"

permissions:
  contents: read

jobs:
  flutter:
    name: flutter test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/mobile
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve packages
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
